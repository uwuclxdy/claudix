name: ci

on:
  push:
    branches: [mommy]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        run: cargo clippy --all-targets --all-features --release -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --release --all-targets --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit

  windows-smoke:
    name: windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows dependencies
        shell: pwsh
        run: choco install protoc --no-progress
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release --locked
      # Asserts the built binary loads and runs on the runner. The runner already
      # has the VC++ redistributable, so this catches a broken build but not the
      # missing-redistributable failure a stock user box hits (documented tradeoff).
      - name: smoke --version
        shell: bash
        run: ./target/release/claudix.exe --version
