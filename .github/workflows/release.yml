name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # gh release upload attaches assets to the release
  id-token: write      # GitHub OIDC — keyless build-provenance attestation (optional)
  attestations: write  # actions/attest-build-provenance (optional)

# Same crates.io HTTP/2 framing flake ci.yml guards against, on the same hosted
# runners: force HTTP/1.1 + extra retries. A transient blip here fails a real
# release build, which costs a re-tag. LTO stays ON — this is the shipped binary,
# not CI's throwaway one.
env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tighten the `v*` trigger to strict vX.Y.Z before any build minutes burn —
        # a malformed tag otherwise ends up on a bare fallback release. Pre-release
        # suffixes (`v1.2.3-rc1`) need the regex relaxed.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z"; exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows-latest ships Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: claudix-linux-x86_64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: claudix-darwin-aarch64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: claudix-windows-x86_64
            ext: .exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # lancedb/lance transitively pulls in prost-build (substrait proto codegen),
      # which needs `protoc` on PATH; the linux leg also needs clang+lld to
      # match `.cargo/config.toml`'s pinned linker for x86_64-unknown-linux-gnu.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test binary
        run: "target/${{ matrix.target }}/release/claudix${{ matrix.ext }} --version"
      - name: Prepare asset
        run: cp "target/${{ matrix.target }}/release/claudix${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Attest build provenance   # optional supply-chain: keyless SLSA provenance for the asset
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Upload artifact for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish assets
    needs: [build]
    # Run even when a build leg fails so the binaries that DID ship still get
    # attached with a matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        # Named SHA256SUMS (not sha256sums.txt) because bin/claudix-bootstrap.js
        # fetches `/SHA256SUMS` and verifies every download against it — the file
        # name IS the contract. Glob whatever was actually built so a partial
        # release still produces a sums file matching exactly what shipped.
        run: |
          cd artifacts
          sha256sum claudix-* > SHA256SUMS
      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # claudix has no release.sh, so a hand-pushed v* tag always hits this
        # fallback: create a bare release so the binaries still land. One upload
        # point (no concurrent softprops find-or-create that could duplicate the
        # release). Never generate notes here. --clobber keeps re-runs idempotent.
        run: |
          cd artifacts
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "" --verify-tag
          gh release upload "${GITHUB_REF_NAME}" claudix-* SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"
