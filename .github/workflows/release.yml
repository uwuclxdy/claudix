name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: claudix-linux-x86_64
          - target: aarch64-apple-darwin
            runner: macos-latest
            asset: claudix-darwin-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: claudix-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc --no-progress
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          binary="target/${{ matrix.target }}/release/claudix"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            binary="${binary}.exe"
          fi
          cp "$binary" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum claudix-* > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/claudix-*
            dist/SHA256SUMS
