name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Release page exists the moment the tag lands; notes are NOT auto-generated
  # (the release script writes them). Each build leg attaches its own binary as
  # it finishes; the checksums job attaches SHA256SUMS last.
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false

  build:
    name: build ${{ matrix.asset_name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows-latest ships Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: claudix-linux-x86_64
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: claudix-darwin-aarch64
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: claudix-windows-x86_64
            ext: .exe
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler clang lld
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc -y
      - name: Build
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke test binary
        run: "target/${{ matrix.target }}/release/claudix${{ matrix.ext }} --version"
      - name: Stage asset
        run: cp "target/${{ matrix.target }}/release/claudix${{ matrix.ext }}" "${{ matrix.asset_name }}${{ matrix.ext }}"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.asset_name }}${{ matrix.ext }}
      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}${{ matrix.ext }}
          path: ${{ matrix.asset_name }}${{ matrix.ext }}
          if-no-files-found: error

  checksums:
    name: checksums
    needs: [build]
    # Run even when a build leg fails so the binaries that DID ship always have a
    # matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum claudix-* > ../SHA256SUMS
      - name: Upload SHA256SUMS to release
        uses: softprops/action-gh-release@v3
        with:
          files: SHA256SUMS
