[package]
name = "claudix"
version = "0.1.0"
edition = "2024"
description = "Local semantic search plugin for Claude Code"
license = "MIT"

[[bin]]
name = "claudix"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-stub"]

[lib]
name = "claudix"
path = "src/lib.rs"

[features]
test-stub = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (rustls only, no openssl)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# LanceDB for storage and FTS
lancedb = "0.14"
arrow = { version = "53", features = ["prettyprint"] }
arrow-array = "53"
arrow-schema = "53"

# Tree-sitter for chunking
tree-sitter = "0.25"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"

# Git enumeration (pure Rust, no C dep)
gix = { version = "0.70", default-features = false, features = ["index"] }

# File walking with gitignore support
ignore = "0.4"

# Path helpers
dirs = "6"

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# ONNX inference for bundled embedder
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
tokenizers = { version = "0.21", default-features = false, features = ["http", "fancy-regex"] }
ndarray = "0.17"

# Tempfile for tests
tempfile = "3"

# MCP server (hand-rolled JSON-RPC fallback if rmcp API is unstable)
# We start with hand-rolled JSON-RPC since rmcp is very new
async-trait = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"

[profile.release]
strip = true
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "warn"
