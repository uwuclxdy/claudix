[package]
name = "claudix"
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local semantic search plugin for Claude Code"
homepage = "https://github.com/uwuclxdy/claudix"
repository = "https://github.com/uwuclxdy/claudix"
readme = "README.md"
keywords = ["semantic-search", "embedding", "claude-code"]
categories = ["command-line-utilities"]

[[bin]]
name = "claudix"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-stub"]

[lib]
name = "claudix"
path = "src/lib.rs"

[features]
default = []
test-stub = []

[dependencies]
# Async runtime
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"

# CLI
clap = { version = "4.6.1", features = ["derive"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"

# Error handling
thiserror = "2.0.18"
anyhow = "1.0.102"

# Logging / tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# HTTP client (rustls only, no openssl)
reqwest = { version = "0.13.4", features = ["json", "rustls", "stream"] }

# LanceDB for storage and FTS
lancedb = "0.31.0"
# arrow MUST match the major lancedb/lance re-export (lancedb 0.31 still re-exports
# arrow 58; a newer arrow here splits the tree into two majors that don't interop
# at the lancedb boundary).
arrow = { version = "58.3.0", features = ["prettyprint"] }
arrow-array = "58.3.0"
arrow-schema = "58.3.0"

# Tree-sitter for chunking
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-sequel = "0.3.11"

# Git enumeration (pure Rust, no C dep)
gix = { version = "0.84.0", default-features = false, features = ["index"] }
gix-hash = { version = "0.25.1", features = ["sha1"] }

# File walking with gitignore support
ignore = "0.4.26"
notify = "8.2.0"

# Path helpers
dirs = "6.0.0"

# Shell-aware tokenisation for hook command parsing
shell-words = "1.1.1"

# Hashing
xxhash-rust = { version = "0.8.15", features = ["xxh3"] }
sha2 = "0.11.0"

# ONNX inference for bundled embedder
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
tokenizers = { version = "0.23.1", default-features = false, features = ["http", "fancy-regex"] }
ndarray = "0.17.2"

# Tempfile for tests
tempfile = "3.27.0"

# Async trait support for embedding provider traits
async-trait = "0.1.89"

# MCP server. schemars (must stay 1.x to match rmcp) derives the tool-arg schemas
# the #[tool] macro requires. The `local` feature drops the `Send` bound on tool
# handlers — the lancedb/moka search pipeline holds `!Send` state across awaits,
# so the service is driven single-threaded inside a `LocalSet` (fine for one
# stdio client); handlers still use the multi-thread runtime for spawn_blocking.
rmcp = { version = "1.8.0", features = ["server", "macros", "transport-io", "schemars", "local"] }
schemars = "1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tokio-test = "0.4.5"

[profile.release]
strip = true
opt-level = 3
# Thin, not fat: fat LTO re-links the whole lancedb/datafusion/ort dep tree on
# every source change, and `cargo test --release --all-targets` pays that link
# once per test binary (minutes each). Thin keeps cross-crate inlining at a
# fraction of the link cost.
lto = "thin"
codegen-units = 1
# panic = "unwind" (the default) is mandatory: catch_unwind and tokio's
# JoinError panic capture are both no-ops under panic = "abort", and hooks must
# fail open in-process. Costs some binary size for unwind tables; worth it.

# Opt-level for the crate under test: 1 avoids most debug-mode overhead while
# keeping incremental rebuilds fast. Heavy numerical deps get opt-level 3 (ONNX,
# tokenizers, ndarray) or 2 (LanceDB / DataFusion / Arrow / tree-sitter) so
# inference and query planning aren't 10-50x slower in test runs.
[profile.test]
opt-level = 1

[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ort-sys]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.lancedb]
opt-level = 2
[profile.dev.package.lance]
opt-level = 2
[profile.dev.package.lance-arrow]
opt-level = 2
[profile.dev.package.lance-bitpacking]
