[profile.dev.package.datafusion-optimizer]
opt-level = 2
[profile.dev.package.datafusion-physical-expr]
opt-level = 2
[profile.dev.package.datafusion-physical-expr-common]
opt-level = 2
[profile.dev.package.datafusion-physical-optimizer]
opt-level = 2
[profile.dev.package.datafusion-physical-plan]
